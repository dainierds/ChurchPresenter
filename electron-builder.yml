appId: com.churchpresenter.app
productName: ChurchPresenter
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - node_modules/sql.js/**/*
extraResources:
  - from: resources/bibles
    to: resources/bibles
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ChurchPresenter
